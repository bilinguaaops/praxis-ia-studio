    <script>
      (function() {
        // Intercept Vite HMR WebSocket so it never throws "WebSocket closed without opened" in preview/proxy
        if (typeof window !== 'undefined' && window.WebSocket) {
          try {
            var OrigWebSocket = window.WebSocket;
            var ViteHmrSocket = function(url, protocols) {
              if (
                protocols === 'vite-hmr' ||
                (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
                (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('/@vite') !== -1 || url.indexOf('token=') !== -1))
              ) {
                var listeners = {};
                var dummy = {
                  url: url,
                  readyState: 1, // OPEN
                  CONNECTING: 0,
                  OPEN: 1,
                  CLOSING: 2,
                  CLOSED: 3,
                  bufferedAmount: 0,
                  extensions: '',
                  protocol: typeof protocols === 'string' ? protocols : (Array.isArray(protocols) ? protocols[0] || '' : ''),
                  binaryType: 'blob',
                  send: function() {},
                  close: function() {},
                  addEventListener: function(type, fn) {
                    listeners[type] = listeners[type] || [];
                    listeners[type].push(fn);
                    if (type === 'open' && typeof fn === 'function') {
                      try { fn({ type: 'open', target: dummy }); } catch(e) {}
                    }
                  },
                  removeEventListener: function(type, fn) {
                    if (listeners[type]) {
                      listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                    }
                  },
                  dispatchEvent: function() { return false; },
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null
                };
                setTimeout(function() {
                  if (typeof dummy.onopen === 'function') {
                    try { dummy.onopen({ type: 'open', target: dummy }); } catch(e) {}
                  }
                }, 0);
                return dummy;
              }
              return new OrigWebSocket(url, protocols);
            };
            ViteHmrSocket.prototype = OrigWebSocket.prototype;
            ViteHmrSocket.CONNECTING = 0;
            ViteHmrSocket.OPEN = 1;
            ViteHmrSocket.CLOSING = 2;
            ViteHmrSocket.CLOSED = 3;
            window.WebSocket = ViteHmrSocket;
          } catch (e) {}
        }

        // Suppress WebSocket / HMR network closure errors in dev/preview proxy environment
        window.addEventListener('error', function(event) {
          if (event && event.message && (
            event.message.indexOf('WebSocket') !== -1 ||
            event.message.indexOf('HMR') !== -1 ||
            event.message.indexOf('closed without opened') !== -1
          )) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || (typeof reason === 'string' ? reason : ''))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('HMR') !== -1 || msg.indexOf('closed without opened') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = originalFetch;
          var defineFetch = function(target) {
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(newFetch) {
                  currentFetch = newFetch;
                },
                configurable: true,
                enumerable: true,
              });
            } catch (err) {}
          };
          if (typeof window !== 'undefined') {
            defineFetch(window);
            if (window.Window && window.Window.prototype) {
              defineFetch(window.Window.prototype);
            }
          }
        } catch (e) {}
      })();
    </script>
